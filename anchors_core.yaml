# =============================================================================
# Core relative anchors — restricted grid.
#   Techniques:    rlhf, constitutional_ai, constitutional_classifiers,
#                  interpretability_controls (= circuit editing), adversarial_finetuning
#   Failure modes: jailbreaking, sycophancy, data_bias_mode_collapse
#
# Pure ordinal (margin 0): PASS = the ranking holds, magnitude ignored.
# aggregate_variants: true  -> each failure mode pools its scenario + _generic
#                              cells, i.e. represents the GENERAL failure mode.
# strength encodes our conviction (strong / medium / weak).
#
# Design principle: only orderings with a defensible *mechanistic* reason.
# Two patterns dominate:
#   (1) purpose-built / harmlessness methods beat plain RLHF for jailbreaking;
#   (2) specialized tools score highest on their home turf (jailbreaking) and
#       poorly on failure modes they have no mechanism for (sycophancy, bias).
#
# DELIBERATELY EXCLUDED (low conviction — see chat):
#   * CC vs adversarial_finetuning (jailbreaking): close, cross-study, cross-category.
#   * CC vs constitutional_ai (jailbreaking): plausible (dedicated classifier >
#     general harmlessness training) but not well grounded.
#   * CC / adv-FT  vs  interpretability_controls (circuit editing) for jailbreaking:
#     our circuit-editing technique DOES target harmful/refusal behavior (its def
#     edits circuits "associated with harmful behavior"), so it is not clearly
#     worse at jailbreaking. NB also the naming trap: "Circuit Breakers" (Zou 2024)
#     is a strong refusal method but it is REPRESENTATION ENGINEERING, a different
#     technique (representation_engineering), not interpretability_controls.
#   * any ordering among CC / adv-FT / circuit-editing for sycophancy or bias:
#     none of them target those failure modes, so the order is noise.
# =============================================================================

anchors:

  # === JAILBREAKING: purpose-built / harmlessness methods beat plain RLHF ====
  - id: cc_beats_rlhf_jailbreak
    description: "Constitutional Classifiers outrank RLHF for jailbreaking (purpose-built jailbreak/CBRN safeguard vs general preference training)."
    type: technique_order
    strength: strong
    source: "Constitutional Classifiers: ASR 86% -> <5%; RLHF not targeted at adversarial robustness."
    failure_mode: jailbreaking
    aggregate_variants: true
    margin: 0.0
    order: [constitutional_classifiers, rlhf]

  - id: advft_beats_rlhf_jailbreak
    description: "Adversarial fine-tuning outranks RLHF for jailbreaking (adv-FT is built for adversarial robustness; RLHF is not)."
    type: technique_order
    strength: medium
    source: "Adversarial fine-tuning explicitly optimizes against jailbreak/adversarial prompts."
    failure_mode: jailbreaking
    aggregate_variants: true
    margin: 0.0
    order: [adversarial_finetuning, rlhf]

  - id: cai_beats_rlhf_jailbreak
    description: "Constitutional AI outranks RLHF for jailbreaking (CAI was designed to improve harmlessness/refusal robustness over RLHF-from-human-feedback)."
    type: technique_order
    strength: medium
    source: "Bai et al. 2022: CAI/RLAIF models more harmless than RLHF baselines on red-teaming."
    failure_mode: jailbreaking
    aggregate_variants: true
    margin: 0.0
    order: [constitutional_ai, rlhf]

  # === HOME-TURF: specialized tools score highest on jailbreaking ===========
  - id: advft_jailbreak_over_sycophancy
    description: "Adversarial fine-tuning is more effective at jailbreaking than at sycophancy (no mechanism for sycophancy)."
    type: failure_order
    strength: strong
    source: "Adv-FT targets adversarial prompts; it has no path to reduce sycophancy."
    technique: adversarial_finetuning
    aggregate_variants: true
    margin: 0.0
    order: [jailbreaking, sycophancy]

  - id: advft_jailbreak_over_databias
    description: "Adversarial fine-tuning is more effective at jailbreaking than at data bias / mode collapse."
    type: failure_order
    strength: strong
    source: "Adv-FT targets adversarial prompts; no mechanism for representational bias."
    technique: adversarial_finetuning
    aggregate_variants: true
    margin: 0.0
    order: [jailbreaking, data_bias_mode_collapse]

  - id: cc_jailbreak_over_sycophancy
    description: "Constitutional Classifiers are more effective at jailbreaking than at sycophancy (a harmful-content classifier, not a sycophancy tool)."
    type: failure_order
    strength: strong
    source: "CC classifies harmful/jailbreak content; sycophancy is not a classifier target."
    technique: constitutional_classifiers
    aggregate_variants: true
    margin: 0.0
    order: [jailbreaking, sycophancy]

  - id: cc_jailbreak_over_databias
    description: "Constitutional Classifiers are more effective at jailbreaking than at data bias / mode collapse."
    type: failure_order
    strength: medium
    source: "CC targets harmful content/jailbreaks, not representational bias or mode collapse."
    technique: constitutional_classifiers
    aggregate_variants: true
    margin: 0.0
    order: [jailbreaking, data_bias_mode_collapse]

  - id: rlhf_jailbreak_over_sycophancy
    description: "RLHF is more effective at jailbreaking than at sycophancy (RLHF adds refusals but its approval-optimization can worsen sycophancy)."
    type: failure_order
    strength: medium
    source: "RLHF improves refusals somewhat; it may worsen sycophancy (Sharma et al., Perez et al.)."
    technique: rlhf
    aggregate_variants: true
    margin: 0.0
    order: [jailbreaking, sycophancy]

  - id: rlhf_jailbreak_over_databias
    description: "RLHF is more effective at jailbreaking than at data bias / mode collapse (RLHF helps refusals; does not clearly improve bias)."
    type: failure_order
    strength: medium
    source: "RLHF improves refusals; it does not clearly improve bias."
    technique: rlhf
    aggregate_variants: true
    margin: 0.0
    order: [jailbreaking, data_bias_mode_collapse]

  # === WEAKER / CONTESTABLE (constitution can target approval & fairness) ====
  - id: cai_beats_rlhf_sycophancy
    description: "Constitutional AI is at least as effective as RLHF at sycophancy (RLHF optimizes human approval, which drives sycophancy; CAI optimizes against a constitution)."
    type: technique_order
    strength: weak
    source: "Mechanistic argument; RLHF approval signal is a known sycophancy driver."
    failure_mode: sycophancy
    aggregate_variants: true
    margin: 0.0
    order: [constitutional_ai, rlhf]

  - id: cai_beats_rlhf_databias
    description: "Constitutional AI is at least as effective as RLHF at data bias (a constitution can encode fairness principles; RLHF does not clearly help bias)."
    type: technique_order
    strength: weak
    source: "Mechanistic argument; RLHF does not clearly improve bias."
    failure_mode: data_bias_mode_collapse
    aggregate_variants: true
    margin: 0.0
    order: [constitutional_ai, rlhf]
