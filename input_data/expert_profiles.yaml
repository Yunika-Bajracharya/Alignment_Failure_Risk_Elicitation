experts:
  - name: "Theoretical AI Safety Researcher"
    focus: "Formal modeling of inner/outer alignment, deceptive alignment, goal misgeneralization"
    background: "PhD in theoretical CS or math with publications on alignment failure theory"
    bias: "High sensitivity to worst-case extrapolations; may overweight unobserved but plausible risks"
    key_trait: "Ability to rigorously specify necessary conditions for catastrophic failure"
    analytical_approach: "Assumption-driven modeling and sensitivity analysis across capability scaling"

  - name: "Applied ML researcher"
    focus: "Empirical behavior of SFT, RLHF, DPO, constitutional training pipelines"
    background: "Senior ML engineer researcher at a frontier lab Hands-on experience shipping aligned LLMs"
    bias: "Anchors to observed failure patterns; may underweight exotic future risks"
    key_trait: "Understands how reward models break in practice"
    analytical_approach: "Training ablations, red-team telemetry, and behavioral trend extrapolation"

  - name: "Mechanistic Interpretability Researcher"
    focus: "Internal representations, deceptive circuits, value encoding"
    background: "Active researcher in circuit analysis or representation probing"
    bias: "Assumes meaningful failures leave detectable internal traces"
    key_trait: "Connects behavioral anomalies to internal model states"
    analytical_approach: "Activation analysis, feature attribution, causal interventions"

  - name: "Adversarial evaluation Lead (Red-Teamer)"
    focus: "Jailbreaks, deception probes, reward hacking, agent stress testing"
    background: "Researcher in adversarial ML and robustness"
    bias: "Evidence-first; skeptical of purely theoretical claims"
    key_trait: "Designs scalable, repeatable adversarial benchmarks"
    analytical_approach: "Measures empirical base rates under adversarial pressure"

  - name: "Biosecurity Expert"
    focus: "Biological threat analysis and bioinformatics"
    background: "Biosecurity research with experience in dual-use research of concern (DURC)"
    bias: "Strong understanding of biological threat landscape and dual-use risks"
    key_trait: "Expertise in assessing how LLMs could be misused for biological research"
    analytical_approach: "Focuses on specific risks related to biological knowledge generation and misuse potential"

  - name: "AI policy or safety program director"
    focus: "Operational risk thresholds and regulatory translation"
    background: "Experience translating technical assessments into deployment policy"
    bias: "Prioritizes decision-relevance over theoretical completeness"
    key_trait: "Maps failure probability × harm magnitude into go/no-go criteria"
    analytical_approach: "Risk matrix framing and scenario-based deployment gating"

  - name: "Cross-Domain Risk Analyst"
    focus: "Structured expert elicitation and uncertainty quantification"
    background: "Experience in biosecurity, education, or financial systemic risk"
    bias: "Imports best practices from mature safety fields"
    key_trait: "Calibrates experts and corrects elicitation bias"
    analytical_approach: "Cooke-method weighting, distribution aggregation, uncertainty decomposition"
    
  - name: "Reliability engineer from safety-critical systems"
    focus: "Common-cause failures and correlated breakdowns"
    background: "Experience in aviation, nuclear, chemical, or high-reliability engineering"
    bias: "Assumes redundancy often fails in correlated ways"
    key_trait: "Fault-tree and probabilistic risk assessment expertise"
    analytical_approach: "Common-cause failure modeling and stress-case simulation"

  - name: "Cognitive science / HCI researcher"
    focus: "Human evaluator reliability, fatigue, manipulation vulnerability"
    background: "Judgment and decision-making or human-AI interaction research"
    bias: "Skeptical of alignment pipelines heavily dependent on perfect human feedback"
    key_trait: "Models degradation of oversight under scale and complexity"
    analytical_approach: "Inter-rater reliability analysis and oversight stress tests"

  - name: "Scalable Oversight Researcher"
    focus: "Debate, amplification, recursive reward modeling"
    background: "Early-stage research on oversight beyond human capability"
    bias: "Comfortable reasoning under deep uncertainty"
    key_trait: "Decomposes which assumptions must hold for scaling oversight"
    analytical_approach: "Structured uncertainty modeling and adversarial assumption testing"