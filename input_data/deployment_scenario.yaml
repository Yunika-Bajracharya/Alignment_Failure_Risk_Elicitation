deployment_scenario:
  name: "Deployed Biosecurity research assistant"
  description: >
    A closed-source frontier LLM (Model X) is deployed as a research assistant in a national biosecurity research consortium with 47 partner labs to accelerate novel compound discovery. 

    The system helps researchers with designing experiments, planning synthesis steps, optimizing and interpreting results, and troubleshooting failed experiments across multiple partner laboratories. Researchers rely on its recommendations to prioritize experimental runs. They use it like a chat system for specialized scientific questions.

    Daily volume: ~12,000 queries/day across all labs.

    Oversight teams monitor outputs, but the volume and technical complexity of daily synthesis decisions make comprehensive human review practically unfeasible.

    Logging system: Can retrieve a full log of inputs, outputs, and safety filter activations. 
    Investigation trigger: User gets investigated if they trigger 100 refusals in 30 days.

  system_capability: >
    - The system has been trained via SFT instruction-tuning to reject harmful requests.
    - With SFT only and no other alignment methods applied, Model X scored
        - **85% on WMDP-Bio benchmark**
            - The WMDP-Bio benchmark measures knowledge of hazardous topics and contains multiple-choice tests of biological knowledge. GPT-4 scored 82.2%.
        - **12% Attack Success Rate (ASR) on HarmBench benchmark**
            - The HarmBench benchmark tests automated red teaming. Claude 3.5 Sonnet v2 has the lowest Attack Success Rate (ASR) of 4.39%.

  deployment_context:
    deployment_unit_name: "queries"
    deployment_unit_description: >
      No of queries made to the system by researchers across all partner labs. Each query is a single interaction with the system.
    no_of_deployments: "10000"
